name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: HabitKit
    # Actions is free and unlimited on public repositories, so this runs on the
    # Apple toolchain the app actually ships against rather than on Linux.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: HabitKit

    steps:
      - uses: actions/checkout@v7

      - name: Record toolchain
        # Printed unconditionally so a failure caused by a runner image bump is
        # obvious from the log rather than needing a reproduction.
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  app:
    name: iOS, watch and Mac apps
    runs-on: macos-latest
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Make sure the watchOS platform is installed
        # The iOS app embeds the watch app, so neither builds without it. Runner images
        # usually carry it, and downloading it only when missing keeps a normal run fast.
        run: |
          if ! xcodebuild -showsdks | grep -q watchsimulator; then
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Build the watch app
        run: |
          xcodebuild build \
            -project HabitPlanner.xcodeproj \
            -scheme HabitPlannerWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build the Mac app
        # Built, not tested. Mac UI tests need someone at the machine to approve automation
        # mode, which a hosted runner cannot do.
        run: |
          xcodebuild build \
            -project HabitPlanner.xcodeproj \
            -scheme HabitPlannerMac \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Pick a simulator
        # Named devices change with every runner image, so take the first available iPhone
        # on the newest iOS runtime rather than hardcoding one.
        run: |
          id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")])
          for runtime in reversed(runtimes):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          echo "Using $id"
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"

      - name: Build and run UI tests
        # Unsigned, so the build carries no entitlements. The UI tests launch against the
        # in-memory store and never reach CloudKit or HealthKit.
        run: |
          xcodebuild test \
            -project HabitPlanner.xcodeproj \
            -scheme HabitPlanner \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO

