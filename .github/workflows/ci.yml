name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: HabitKit
    # Actions is free and unlimited on public repositories, so this runs on the
    # Apple toolchain the app actually ships against rather than on Linux.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: HabitKit

    steps:
      - uses: actions/checkout@v4

      - name: Record toolchain
        # Printed unconditionally so a failure caused by a runner image bump is
        # obvious from the log rather than needing a reproduction.
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test
